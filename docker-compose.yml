# Claw Dashboard — Full Stack
# One-click deployment: docker compose up -d

services:
  # -- PostgreSQL --
  postgres:
    image: postgres:17-alpine
    container_name: claw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: claw
      POSTGRES_USER: claw
      POSTGRES_PASSWORD: ${PG_PASSWORD:-claw_secret}
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "${PG_PORT:-5432}:5432"
    networks:
      - claw-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claw"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # -- Redis --
  redis:
    image: redis:7-alpine
    container_name: claw-redis
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - claw-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M

  # -- Rust API --
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: ghcr.io/veritas-calculus/claw-api:latest
    container_name: claw-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://claw:${PG_PASSWORD:-claw_secret}@postgres:5432/claw
      REDIS_URL: redis://redis:6379
      RUST_LOG: claw_api=info,tower_http=info
    networks:
      - claw-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "1.0"

  # -- Frontend (Nginx) --
  dashboard:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: ghcr.io/veritas-calculus/claw-dashboard:latest
    container_name: claw-dashboard
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-3000}:8080"
    networks:
      - claw-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

volumes:
  pg-data:
    driver: local

networks:
  claw-net:
    driver: bridge
    name: claw-network
